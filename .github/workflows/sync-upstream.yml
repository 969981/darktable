name: Check official darktable upstream and publish

on:
  push:
    branches:
      - darktable-1.1.x
    paths:
      - .github/workflows/sync-upstream.yml
  schedule:
    - cron: '37 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: darktable-master-autosync
  cancel-in-progress: false

jobs:
  sync:
    name: Check official master and dispatch release builds
    if: github.repository == '969981/darktable'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # GITHUB_TOKEN cannot push official commits changing .github/workflows.
      # Build the immutable official revision instead of rewriting fork master.
      - name: Check official master and existing release safely
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          latest="$(gh api repos/darktable-org/darktable/commits/master --jq '.sha')"
          [[ "$latest" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::Could not verify official darktable master SHA."
            exit 1
          }
          echo "Official master: $latest"
          echo "sha=$latest" >> "$GITHUB_OUTPUT"
          tag="autosync-${latest:0:12}"
          assets="$(gh release view "$tag" --json assets --jq '.assets[].name' 2>/dev/null || true)"
          if grep -Eq '\.AppImage$' <<<"$assets" &&
             grep -Eq '\.exe$' <<<"$assets" &&
             grep -Eq '\.dmg$' <<<"$assets"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Already published $tag" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Building official source $latest without rewriting fork workflows." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Start official multi-platform builds
        if: steps.upstream.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.upstream.outputs.sha }}
        run: |
          set -euo pipefail
          gh workflow run build-release.yml --repo "$GITHUB_REPOSITORY" \
            --ref darktable-1.1.x -f source_sha="$SHA"
          echo "Dispatched builds for $SHA" >> "$GITHUB_STEP_SUMMARY"

      - name: Report no new changes
        if: steps.upstream.outputs.changed != 'true'
        run: echo "Upstream commit already dispatched; no new builds." >> "$GITHUB_STEP_SUMMARY"

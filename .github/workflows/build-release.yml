name: Darktable upstream change builds and releases

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: 'Exact 40 character upstream master commit SHA'
        required: true
        type: string

permissions:
  contents: read

env:
  DARKTABLE_SOURCE_SHA: ${{ inputs.source_sha }}

jobs:
  AppImage:
    if: github.repository == 'darktable-org/darktable' || github.event_name == 'workflow_dispatch'
    name: Nightly darktable AppImage
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04-arm]
        branch:
          - { code: master, label: gitmaster }
        include:
          - os: ubuntu-22.04
            compiler: { compiler: GNU12, CC: gcc-12, CXX: g++-12, packages: gcc-12 g++-12 }
          - os: ubuntu-24.04-arm
            compiler: { compiler: GNU14, CC: gcc-14, CXX: g++-14, packages: gcc-14 g++-14 }
    env:
      CC: ${{ matrix.compiler.CC }}
      CXX: ${{ matrix.compiler.CXX }}
      SRC_DIR: ${{ github.workspace }}/src
      BUILD_DIR: ${{ github.workspace }}/build
      INSTALL_PREFIX: ${{ github.workspace }}/AppDir/usr
      CMAKE_BUILD_TYPE: ${{ matrix.btype }}
      GENERATOR: ${{ matrix.generator }}
      TARGET: ${{ matrix.target }}
      BRANCH: ${{ matrix.branch.code }}
      BUILD_NAME: ${{ matrix.branch.label }}
    steps:
      - name: Install compiler ${{ matrix.compiler.compiler }}
        run: |
          sudo apt-get update
          sudo apt-get -y install \
            ${{ matrix.compiler.packages }}
      - name: Install Base Dependencies
        run: |
          sudo apt-get -y install \
            build-essential \
            desktop-file-utils \
            gettext \
            git \
            gdb \
            intltool \
            libarchive-dev \
            libatk1.0-dev \
            libcairo2-dev \
            libcolord-dev \
            libcolord-gtk-dev \
            libcups2-dev \
            libcurl4-gnutls-dev \
            libimage-exiftool-perl \
            libfuse2 \
            libgdk-pixbuf2.0-dev \
            libglib2.0-dev \
            libgmic-dev \
            libgraphicsmagick1-dev \
            libgtk-3-dev \
            libinih-dev \
            libjson-glib-dev \
            liblcms2-dev \
            liblensfun-dev \
            liblensfun-bin \
            liblensfun-data-v1 \
            liblensfun1 \
            libopencv-calib3d-dev \
            libopencv-core-dev \
            libopencv-features2d-dev \
            libopencv-flann-dev \
            libopencv-imgproc-dev \
            libosmgpsmap-1.0-dev \
            libpango1.0-dev \
            libpng-dev \
            libportmidi-dev \
            libpotrace-dev \
            libpugixml-dev \
            librsvg2-dev \
            libsaxon-java \
            libsdl2-dev \
            libsecret-1-dev \
            libsqlite3-dev \
            libtiff5-dev \
            libwebp-dev \
            libx11-dev \
            libxml2-dev \
            libxml2-utils \
            ninja-build \
            perl \
            po4a \
            python3-jsonschema \
            xsltproc \
            zlib1g-dev \
            appstream
      - name: Add PPA for newer multimedia libs (x86_64 only)
        if: runner.arch != 'ARM64'
        run: |
          sudo add-apt-repository -y ppa:savoury1/graphics
          sudo add-apt-repository -y ppa:savoury1/ffmpeg4
          sudo add-apt-repository -y ppa:savoury1/display
          sudo apt-get update
      - name: Install extra dependencies
        run: |
          sudo apt-get -y install \
            aom-tools \
            libaom-dev \
            libavif-dev \
            libgphoto2-dev \
            libde265-dev \
            libimath-dev \
            libjpeg-turbo8-dev \
            libjxl-dev \
            libopenexr-dev \
            libopenh264-dev \
            libopenjp2-7-dev \
            libsharpyuv-dev \
            libx265-dev \
            libwebm-dev \
            x11proto-dev \
            libxfixes-dev
      - name: Build and install fresh libheif with built-in decoders
        run: |
          git clone --branch v1.23.7 --depth 1 https://github.com/strukturag/libheif src-libheif
          cd src-libheif
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_PLUGIN_LOADING=OFF \
            -DWITH_LIBDE265=ON \
            -DWITH_AOM_DECODER=ON \
            -DWITH_AOM_ENCODER=ON \
            -DWITH_OpenH264_DECODER=ON \
            -DWITH_JPEG_DECODER=ON \
            -DWITH_OpenJPEG_DECODER=ON \
            -DWITH_LIBSHARPYUV=ON \
            -DCMAKE_INSTALL_PREFIX=/usr
          ninja -C build
          sudo ninja -C build install
          cd ..
      - name: Build and install a more recent version of exiv2
        run: |
          git clone --branch v0.28.9 --depth 1 https://github.com/Exiv2/exiv2 src-exiv2
          cd src-exiv2
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DEXIV2_ENABLE_NLS=ON \
            -DEXIV2_ENABLE_VIDEO=OFF \
            -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build
          sudo cmake --install build
          cd ..
      - name: Checkout darktable master branch
        run: |
          # Note that we can't make a shallow clone to reduce clone traffic and time, as we have to
          # fetch the entire history to correctly generate the version for the AppImage filename
          git clone -b master https://github.com/${{ github.repository }} src
          git -C src checkout --detach "$DARKTABLE_SOURCE_SHA"
          pushd src
          git submodule init
          git config submodule.src/tests/integration.update none
          git submodule update
          popd
      - name: Update Lensfun data
        run: |
          sudo lensfun-update-data
      - name: Set correct AppImage update info for release build
        if: false # The auto-sync builds master development snapshots, not stable releases
        run: |
          # Set the environment variable for build step. This is only needed
          # for release builds, for nightly builds the build script does the
          # right thing even if this environment variable is not present.
          echo "DARKTABLE_APPIMAGE_UPDATE=release" >> $GITHUB_ENV
      - name: Build AppImage
        run: |
          cd src
          bash tools/appimage-build-script.sh
      - name: Package upload
        uses: actions/upload-artifact@v7
        with:
          path: ${{ github.workspace }}/src/build/Darktable-*.AppImage*
          name: artifact-appimage-${{ runner.arch }}
          retention-days: 1

  Windows:
    if: github.repository == 'darktable-org/darktable' || github.event_name == 'workflow_dispatch'
    name: Nightly darktable Windows
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        btype:
          - Release
        msystem:
          - UCRT64
          - CLANGARM64
        target:
          - skiptest
        generator:
          - Ninja
        eco: [-DBINARY_PACKAGE_BUILD=ON]
        include:
          - msystem: UCRT64
            os: windows-latest
          - msystem: CLANGARM64
            os: windows-11-arm
    defaults:
      run:
        shell: msys2 {0}
    env:
      SRC_DIR: ${{ github.workspace }}/src
      BUILD_DIR: ${{ github.workspace }}/build
      INSTALL_PREFIX: ${{ github.workspace }}/install
      ECO: ${{ matrix.eco }}
      CMAKE_BUILD_TYPE: ${{ matrix.btype }}
      TARGET: ${{ matrix.target }}
      GENERATOR: ${{ matrix.generator }}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          install: >-
            git
            intltool
            po4a
          pacboy: >-
            cc:p
            cmake:p
            libxslt:p
            ninja:p
            python-jsonschema:p
            curl:p
            drmingw:p
            cc-libs:p
            gettext:p
            gmic:p
            graphicsmagick:p
            gtk3:p
            icu:p
            imath:p
            iso-codes:p
            lcms2:p
            lensfun:p
            libavif:p
            libgphoto2:p
            libheif:p
            libjpeg-turbo:p
            libjxl:p
            libpng:p
            librsvg:p
            libsecret:p
            libtiff:p
            libwebp:p
            libxml2:p
            lua54:p
            omp:p
            opencv:p
            openexr:p
            openjpeg2:p
            osm-gps-map:p
            portmidi:p
            potrace:p
            pugixml:p
            SDL2:p
            sqlite3:p
            webp-pixbuf-loader:p
            zlib:p
          update: true
      - name: Build and install the latest compatible version of exiv2
        run: |
          git clone --branch v0.27.7 --depth 1 https://github.com/Exiv2/exiv2 src-exiv2
          cd src-exiv2
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=ON \
            -DEXIV2_ENABLE_BMFF=ON \
            -DEXIV2_ENABLE_NLS=ON \
            -DEXIV2_ENABLE_VIDEO=OFF \
            -DEXIV2_ENABLE_WIN_UNICODE=ON \
            -DCMAKE_INSTALL_PREFIX=${MINGW_PREFIX}
          cmake --build build
          cmake --install build
          cd ..
      - run: git config --global core.autocrlf input
        shell: bash
      - name: Checkout darktable master branch
        run: |
          # Note that we can't make a shallow clone to reduce clone traffic and time, as we have to
          # fetch the entire history to correctly generate the version for the installation package filename
          git clone -b master https://github.com/${{ github.repository }} src
          git -C src checkout --detach "$DARKTABLE_SOURCE_SHA"
          pushd src
          git submodule init
          git config submodule.src/tests/integration.update none
          git submodule update
          popd
      - name: Update Lensfun data
        run: |
          lensfun-update-data
      - name: Build and Install
        run: |
          cmake -E make_directory "${BUILD_DIR}"
          cmake -E make_directory "${INSTALL_PREFIX}"
          $(cygpath ${SRC_DIR})/.ci/ci-script.sh
      - name: Create multi-resolution icon file
        run: |
          # Create multi-resolution .ico file expected by the .iss script for use as setup file icon.
          # Use MSYS2 ImageMagick as pre-installed IM is not working on the WoA runner.
          pacboy --noconfirm -S --needed imagemagick:p
          magick "${SRC_DIR}"/data/pixmaps/256x256/darktable.png -define icon:auto-resize="256,128,64,48,32,16" "${INSTALL_PREFIX}"/dt_logo_multiresolution.ico
      - name: Create Inno Setup installer
        shell: pwsh
        run: |
          choco upgrade innosetup --no-progress
          cd ${{ env.INSTALL_PREFIX }}
          cp ${{ env.BUILD_DIR }}/darktable.iss ./
          iscc "darktable.iss"
          mv Output/*.exe ${{ env.BUILD_DIR }}/
      - name: Get version info
        run: |
          cd ${SRC_DIR}
          echo "VERSION=$(git describe --tags --match release-* | sed 's/^release-//;s/-/+/;s/-/~/;s/rc/~rc/')" >> $GITHUB_ENV
          ([[ ${MSYSTEM_CARCH} == x86_64 ]] && echo "SYSTEM=win64" || echo "SYSTEM=woa64") >> $GITHUB_ENV
      - name: Package upload
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.BUILD_DIR }}/*.exe
          name: artifact-windows-${{ runner.arch }}
          retention-days: 1

  macOS:
    if: github.repository == 'darktable-org/darktable' || github.event_name == 'workflow_dispatch'
    name: Nightly darktable macOS
    runs-on: ${{ matrix.build.os }}
    strategy:
      fail-fast: false
      matrix:
        build:
          - { os: macos-15,       xcode: 26.3, deployment: 15.0 } # AppleClang 17, arm64
        compiler:
          - { compiler: XCode,   CC: cc, CXX: c++ }
        btype: [ Release ]
        eco: [-DBINARY_PACKAGE_BUILD=ON -DBUILD_CURVE_TOOLS=ON -DBUILD_NOISE_TOOLS=ON -DUSE_GRAPHICSMAGICK=ON -DUSE_IMAGEMAGICK=OFF]
        target:
          - skiptest
        generator:
          - Ninja
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.build.xcode }}.app/Contents/Developer
      CC: ${{ matrix.compiler.CC }}
      CXX: ${{ matrix.compiler.CXX }}
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.build.deployment }}
      SRC_DIR: ${{ github.workspace }}/src
      BUILD_DIR: ${{ github.workspace }}/src/build
      INSTALL_PREFIX: ${{ github.workspace }}/src/build/macosx
      ECO: ${{ matrix.eco }}
      CMAKE_BUILD_TYPE: ${{ matrix.btype }}
      GENERATOR: ${{ matrix.generator }}
      TARGET: ${{ matrix.target }}
    steps:
      - name: Checkout darktable master branch
        run: |
          # Note that we can't make a shallow clone to reduce clone traffic and time, as we have to
          # fetch the entire history to correctly generate the version for the disk image filename
          git clone -b master https://github.com/${{ github.repository }} src
          git -C src checkout --detach "$DARKTABLE_SOURCE_SHA"
          pushd src
          git submodule init
          git config submodule.src/tests/integration.update none
          git submodule update
          popd
      - name: Install Base Dependencies
        run: |
          # The GitHub runner images ship aws/tap, which Homebrew does not trust and
          # thus warns about on every invocation. We don't use it, so drop it.
          brew untap --force aws/tap || true
          brew update > /dev/null || true
          cd src/.ci
          export HOMEBREW_NO_INSTALL_UPGRADE=1
          brew bundle --verbose || true

          # Rebuild GraphicsMagick for macOS bundling
          export HOMEBREW_NO_INSTALL_FROM_API=1
          brew developer on
          gm_formula=`brew edit --quiet --print-path graphicsmagick`
          cat $gm_formula | sed 's/--with-modules/--disable-installed/1' > gm_formula.tmp
          mv gm_formula.tmp $gm_formula
          brew reinstall --build-from-source --force --quiet graphicsmagick
      - name: Build and Install
        run: |
          cmake -E make_directory "${BUILD_DIR}";
          cmake -E make_directory "${INSTALL_PREFIX}";
          ./src/.ci/ci-script.sh;
      - name: Build macOS package
        run: |
          ./src/packaging/macosx/3_make_hb_darktable_package.sh
      - name: Create DMG file
        run: |
          ./src/packaging/macosx/4_make_hb_darktable_dmg.sh
      - name: Get version info
        run: |
          cd ${SRC_DIR}
          echo "VERSION=$(git describe --tags --match release-* | sed 's/^release-//;s/-/+/;s/-/~/;s/rc/~rc/')" >> $GITHUB_ENV
          echo "ARCHITECTURE=$(uname -m)" >> $GITHUB_ENV
      - name: Package upload
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.INSTALL_PREFIX }}/darktable-${{ env.VERSION }}-${{ env.ARCHITECTURE }}.dmg
          name: artifact-macos-${{ runner.arch }}
          retention-days: 1

  upload_to_release:
    name: Publish all built platforms to GitHub Releases
    runs-on: ubuntu-24.04
    needs: [AppImage, Windows, macOS]
    permissions:
      contents: write
    steps:
      - name: Download every platform artifact
        uses: actions/download-artifact@v8

      - name: Validate SHA and all platform binaries
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DARKTABLE_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          find artifact-appimage-* -type f -name '*.AppImage' | grep -q .
          find artifact-windows-* -type f -name '*.exe' | grep -q .
          find artifact-macos-* -type f -name '*.dmg' | grep -q .

      - name: Publish commit-specific development prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          short="${DARKTABLE_SOURCE_SHA:0:12}"
          tag="autosync-$short"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" \
              --target "$DARKTABLE_SOURCE_SHA" --prerelease \
              --title "darktable development $short" \
              --notes "Unofficial snapshot compiled from darktable-org/darktable master at $DARKTABLE_SOURCE_SHA. Includes Linux AppImage, Windows installer, and macOS DMG packages. Nightly builds may update darktable library databases; use a separate test library."
          fi
          shopt -s nullglob
          files=(artifact-appimage-*/* artifact-windows-*/* artifact-macos-*/*)
          test "${#files[@]}" -gt 0
          gh release upload "$tag" "${files[@]}" --repo "$GITHUB_REPOSITORY" --clobber
          echo "Published https://github.com/$GITHUB_REPOSITORY/releases/tag/$tag" >> "$GITHUB_STEP_SUMMARY"
